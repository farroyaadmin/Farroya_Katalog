*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.6 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--n0);color:#eaf0f8;overflow-x:hidden}
img{max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit;padding:0;border:0;background:none;color:inherit}
h1,h2,h3,.wm,.gc b,.pr,.slg{font-family:var(--hf);font-weight:600;line-height:1.12}
h1{font-size:2.5rem}h2{font-size:2rem;margin-bottom:12px}h3{font-size:1.4rem}
.mut,.load{color:var(--mt)}.load{padding:30px 20px}
.mark{display:block;background:var(--mk) center/contain no-repeat}
.in{max-width:1040px;margin:0 auto;padding:0 20px}
main.in{padding-bottom:48px}main.in section{margin:26px 0}
.top{position:sticky;top:0;z-index:20;background:rgba(5,15,32,.93);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:10px;max-width:1040px;margin:0 auto;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand .mark{width:30px;height:44px}
.wm{font-size:1.4rem;letter-spacing:.2em;line-height:1}
.wm small{display:block;margin-top:5px;font:500 .55rem -apple-system,system-ui,sans-serif;letter-spacing:.34em;color:var(--mt)}
.nav{display:none;font-size:.95rem;color:var(--mt)}
.nav a{display:block;padding:6px 0;border-bottom:1px solid transparent}.nav a.on{color:#fff;border-color:var(--sv)}
.ic2{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:#fff;cursor:pointer}
.ic2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.burger i{display:block;width:18px;height:2px;background:#fff;box-shadow:0 6px #fff,0 -6px #fff}
@media(max-width:899px){.top.open .nav{display:block;position:absolute;top:100%;left:0;right:0;padding:6px 20px 16px;background:var(--n1);border-bottom:1px solid var(--ln)}.top.open .nav a{padding:13px 0;font-size:1.05rem;border-bottom:1px solid rgba(190,208,235,.1)}}
@media(min-width:900px){.nav{display:flex;gap:26px}.burger{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--sv);color:#fff;font-weight:600;font-size:.95rem;text-align:center;cursor:pointer}
.btn[hidden]{display:none}
.btn.pri{background:linear-gradient(180deg,#f1f5fb,#b7c6da);color:#0a1b36;border-color:#e3ebf6;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.btn.wide{display:flex;width:100%;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}.row .btn{flex:1 1 150px}
.ey{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mt)}
.ey::after{content:"";width:56px;height:1px;background:var(--ln)}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;min-height:460px;padding:44px 0 52px;background:linear-gradient(180deg,rgba(5,15,32,.9),rgba(5,15,32,.5) 70%,rgba(5,15,32,.85)),url(latar.jpg) 62% center/cover,var(--n1)}
.hero>.mark{position:absolute;right:-5%;bottom:5%;width:46%;max-width:360px;aspect-ratio:559/872;opacity:.16;pointer-events:none}
.hero .in{position:relative;width:100%}.hero .row .btn{flex:1 1 100%}.hero .lead{margin:16px 0 26px;max-width:46ch;color:#d3deee}
@media(min-width:900px){.hero{min-height:620px;background:linear-gradient(90deg,rgba(5,15,32,.94) 10%,rgba(5,15,32,.45) 65%,rgba(5,15,32,.15)),url(latar.jpg) 70% center/cover,var(--n1)}h1{font-size:3.4rem}.row .btn,.hero .row .btn{flex:0 0 auto}}
.sec{padding:56px 0}.alt{background:linear-gradient(180deg,var(--n1),#07142a)}
.ed{display:grid;gap:26px}.ed .btn{margin-top:14px}
@media(min-width:900px){.ed{grid-template-columns:.8fr 1.4fr;align-items:start}.gcs{grid-template-columns:1fr 1fr}}
.gcs{display:grid;gap:14px}
.gc,.panel{display:block;position:relative;padding:22px;border-radius:24px;border:1px solid var(--ln);background:linear-gradient(150deg,rgba(70,110,170,.4),rgba(10,27,54,.88));box-shadow:0 12px 30px rgba(0,0,0,.35)}
.gc h3{font-size:1.7rem}.gc p{margin:4px 0 12px;color:var(--mt);font-size:.9rem}
.gc b{display:block;font-size:1.55rem}.gc small{color:var(--mt)}.gc .go{display:block;margin-top:12px;color:var(--sv);font-size:.88rem}
.hl{display:flex;gap:8px;margin-top:14px}.hl img{flex:1;min-width:0;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--ln);background:#0a0a0a}
.panel p{margin:8px 0 14px;color:#d3deee}.from{display:block;font:600 1.7rem var(--hf);color:#fff}
.silver{padding:56px 0;background:linear-gradient(160deg,#d4dfed,#a9bbd4);color:#0a1b36}
.silver .ey{color:#4a6288}.silver .ey::after{background:rgba(10,27,54,.25)}.silver h2{color:#0a1b36;margin:0}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:22px}.lk{font-size:.9rem;color:#17386b;font-weight:600}
.pg6{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pg6 a{display:block}
.pg6 img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#0b0b0b;border-radius:14px;box-shadow:0 8px 20px rgba(10,27,54,.28)}
@media(min-width:700px){.pg6{grid-template-columns:repeat(3,1fr)}}
.adv{display:grid;grid-template-columns:1fr 1fr}
.adv div{padding:24px 12px;text-align:center}.adv div:nth-child(even){border-left:1px solid var(--ln)}.adv div:nth-child(n+3){border-top:1px solid var(--ln)}
.adv svg{width:38px;height:38px;fill:none;stroke:var(--sv);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.adv b{display:block;font-size:.95rem}.adv small{display:block;color:var(--mt);font-size:.78rem;line-height:1.4;margin-top:4px}
@media(min-width:900px){.adv{grid-template-columns:repeat(4,1fr)}.adv div{border:0!important;border-left:1px solid var(--ln)!important}.adv div:first-child{border-left:0!important}}
.back{display:inline-block;margin:18px 0 8px;color:var(--sv);font-weight:600}
.tier{padding:20px;margin-bottom:14px;border-radius:22px;border:1px solid var(--ln);background:linear-gradient(160deg,rgba(40,72,120,.35),rgba(10,27,54,.8))}
.tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bd{padding:3px 12px;border-radius:999px;background:linear-gradient(180deg,#f1f5fb,#b7c6da);color:#0a1b36;font-size:.75rem;font-weight:700;white-space:nowrap}.bd.k{background:#2a5fb0;color:#fff}
.pr{font-size:2.1rem;margin:6px 0 10px}.pr.t{font-size:1.3rem}
.hi{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:rgba(120,170,255,.16);border:1px solid #8fb2ea;font-weight:600;color:#e6efff}
.tier:has(.hi){border-color:#8fb2ea}
.tier ul{padding:0}.tier li{list-style:none;position:relative;padding-left:24px;margin:6px 0;color:#d3deee}.tier li::before{content:"\2713";position:absolute;left:0;color:var(--sv)}
.th{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.th img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--ln);cursor:zoom-in}
.th small{grid-column:1/-1;color:var(--mt);font-size:.78rem}
.hlg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hlg img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--ln);background:#0a0a0a}
.lb{position:fixed;inset:0;z-index:30;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start;background:rgba(5,15,32,.95)}.lbi{width:100%;max-width:560px;margin:auto;display:flex;flex-direction:column;gap:6px}.lbi img{width:100%;max-height:72vh;object-fit:contain;border-radius:16px;background:#0d1f3a}.lbi .btn{margin-top:10px}.gh{margin:30px 0 12px;font-size:1.6rem}.card[data-id]{cursor:pointer}
input[type=search]{width:100%;min-height:48px;padding:0 18px;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;font:inherit;margin-bottom:12px}
input::placeholder{color:var(--mt)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:9px 16px;border:1px solid var(--ln);border-radius:999px;font-size:.85rem;color:var(--mt)}
.chip.on{background:linear-gradient(180deg,#f1f5fb,#b7c6da);border-color:#e3ebf6;color:#0a1b36;font-weight:600}
details{margin-bottom:12px}summary{color:var(--sv);font-weight:600;padding:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(min-width:700px){.grid,.hlg{grid-template-columns:repeat(3,1fr)}}
.card .ph{aspect-ratio:1;background:#0d1f3a;border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;display:block}.card h3{font-size:1.15rem;margin-top:8px}.card p{font-size:.8rem;color:var(--mt)}
.big{display:block;width:100%;border-radius:20px;border:1px solid var(--ln);background:#0d1f3a;margin:6px 0 14px}
.sm{color:var(--mt);font-size:.9rem}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tags span{padding:4px 12px;border:1px solid var(--sv);border-radius:999px;font-size:.8rem}
.desc{margin:12px 0;white-space:pre-line;color:#d3deee}
.pkg{padding:12px 14px;margin-bottom:8px;border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.04)}.pkg b{display:block}.pkg span{color:var(--sv);font-weight:600}.pkg small{display:block;color:var(--mt)}
.note{font-size:.82rem;color:var(--mt);text-align:center;margin-top:12px}
.ft{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 20px calc(40px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--ln);background:linear-gradient(180deg,rgba(5,15,32,.88),rgba(5,15,32,.97)),url(latar.jpg) 70% 85%/cover,var(--n0)}
.ft .mark{width:44px;height:68px}.slg{font-size:1.5rem;font-style:italic;font-weight:500;color:var(--sv)}.ft .row{justify-content:center}.ft .row .btn{flex:0 1 160px}.ft small{max-width:42ch;color:var(--mt);font-size:.78rem}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sv);outline-offset:2px}
.nav a[data-r="vip-alumni"]{color:#d6b56a}.nav a.on[data-r="vip-alumni"]{color:#f3e2b0;border-color:#d6b56a}
.vh{position:relative;overflow:hidden;text-align:center;padding:64px 0 56px;background:linear-gradient(180deg,rgba(5,15,32,.84),rgba(5,15,32,.7) 50%,rgba(5,15,32,.96)),url(latar.jpg) 65% 30%/cover,var(--n1);border-bottom:1px solid rgba(214,181,106,.4)}
.vh>.mark{position:absolute;left:50%;top:14px;width:170px;aspect-ratio:559/872;transform:translateX(-50%);opacity:.09;pointer-events:none}
.vh .in{position:relative}.vh .ey{justify-content:center}.vh .ey::after{display:none}.gdt{color:#d6b56a!important}
.vh h1{font-size:1.75rem;letter-spacing:.08em;line-height:1.3;margin:6px 0 18px}
.orn{height:1px;width:150px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,#d6b56a,transparent)}
.d20{display:flex;flex-direction:column;align-items:center;line-height:1}
.d20 span{font-size:.95rem;letter-spacing:.5em;padding-left:.5em;color:#d3deee}
.d20 b{margin:8px 0;font:600 5.4rem var(--hf);background:linear-gradient(180deg,#f6e8bc,#c9a24f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sub{margin:12px 0 16px;font:italic 500 1.5rem var(--hf);color:var(--sv)}
.vh .lead{max-width:56ch;margin:0 auto 26px;color:#d3deee}
.btn.gold{background:linear-gradient(180deg,#f6e8bc,#c9a24f);border-color:#e8d08f;color:#2a1d04;letter-spacing:.08em;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.vg{display:grid;gap:12px}
.vc{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;border:1px solid var(--ln);border-left:3px solid #d6b56a;background:linear-gradient(150deg,rgba(70,110,170,.3),rgba(10,27,54,.9))}
.vc i{min-width:34px;font:600 1.8rem var(--hf);font-style:normal;color:#d6b56a}
.vc b{display:block;font:600 1.25rem var(--hf);line-height:1.2;color:#fff}.vc small{color:var(--mt);font-size:.88rem}
.vt ul{display:grid;gap:10px;padding:0;list-style:none}
.vt li{position:relative;padding:14px 16px 14px 46px;border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.04);color:#d3deee}
.vt li::before{content:"\2713";position:absolute;left:18px;color:#d6b56a;font-weight:700}
@media(min-width:700px){.vg{grid-template-columns:1fr 1fr}.vh h1{font-size:2.5rem}}
@media(min-width:980px){.vg{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top" id="top"><div class="bar"><a class="brand" href="#/"><i class="mark"></i><span class="wm">FARROYA<small>ARABIC DESIGN</small></span></a>
<nav class="nav" id="nav"><a data-r="" href="#/">Beranda</a><a data-r="paket" href="#/paket">Paket</a><a data-r="katalog" href="#/katalog">Katalog</a><a data-r="vip-alumni" href="#/vip-alumni">VIP Alumni</a><a data-r="tentang" href="#/tentang">Tentang</a><a data-r="kontak" href="#/kontak">Kontak</a></nav>
<a class="ic2 wa" target="_blank" rel="noopener" aria-label="Konsultasi WhatsApp"><svg viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg></a>
<button class="ic2 burger" id="bg" aria-label="Menu"><i></i></button></div></header>
<main id="app"><p class="load">Memuat katalog...</p></main>
<footer class="ft"><i class="mark"></i><span class="wm">FARROYA<small>ARABIC DESIGN</small></span><p class="slg">Karena setiap logo punya cerita</p><div class="row"><a class="btn wa" target="_blank" rel="noopener">WhatsApp</a><a class="btn" id="tt" hidden target="_blank" rel="noopener">TikTok</a></div><small>Harga akhir, ketersediaan, dan waktu pengerjaan dikonfirmasi admin melalui WhatsApp.</small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const C=window.FAROYA,sb=supabase.createClient(C.url,C.key),app=document.getElementById("app"),hd=document.getElementById("top");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img=p=>!p?"":/^katalog-/.test(p)?((window.KATALOG||{})[p]||p):sb.storage.from("karya").getPublicUrl(p).data.publicUrl;
const hi="Assalamu'alaikum Farroya Arabic Design, ";
let D,KP;const needKat=()=>KP||(KP=new Promise(r=>{if(window.KATALOG)return r();const s=document.createElement("script");s.src="katalog.js";s.onload=s.onerror=()=>r();document.head.appendChild(s)}));
const wa=t=>`https://wa.me/${D.wa}?text=${encodeURIComponent(t)}`;
const cn=id=>(D.cats.find(c=>c.id===id)||{}).nama||"";
const catName=w=>[cn(w.category_id),cn(w.subcategory_id)].filter(Boolean).join(", ");
const rp=n=>"Rp"+Number(n).toLocaleString("id-ID");
const mulai=g=>{const p=g.tiers.filter(t=>t.harga!=null).map(t=>t.harga);return p.length?"Mulai dari "+rp(Math.min(...p)):"Konfirmasi melalui WhatsApp"};
const HL={majelis:[0,3,9,1,12],brand:[5,6,11,10,14],lembaga:[2,4,8,7]},PORT=[0,2,5,6,9,12];
const hl=(g,k)=>(g.slug==="wedding"?(window.WEDDING||[]):window.HASIL&&HL[g.slug]?HL[g.slug].map(i=>HASIL[i]).filter(Boolean):[]).slice(0,k);
const TP={"wedding:150000":[0],"wedding:100000":[1],"wedding:50000":[2,3]};
const tierImgs=(g,t)=>window.WEDDING?(TP[g.slug+":"+t.harga]||[]).map(i=>WEDDING[i]).filter(Boolean):[];
const IC={pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',head:'<path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'};
async function load(){
  const [c,s,w,t,pg,pt]=await Promise.all([
    sb.from("categories").select("*").order("urutan"),
    sb.from("styles").select("*").order("nama"),
    sb.from("works").select("*,work_styles(style_id),work_packages(*)").eq("status","tampil").order("dibuat",{ascending:false}),
    sb.from("settings").select("*"),
    sb.from("package_groups").select("*").order("urutan"),
    sb.from("package_tiers").select("*").eq("aktif",true).order("urutan")]);
  const e=c.error||s.error||w.error||t.error||pg.error||pt.error; if(e)throw e;
  const set=Object.fromEntries(t.data.map(x=>[x.kunci,x.nilai]));
  D={cats:c.data,styles:s.data,works:w.data,wa:set.whatsapp_number||C.wa,groups:pg.data.map(g=>({...g,tiers:pt.data.filter(x=>x.group_id===g.id)})).filter(g=>g.tiers.length)};
}
const gcard=g=>{const t=hl(g,3);return `<a class="gc" href="#/paket/${esc(g.slug)}"><h3>${esc(g.nama)}</h3><p>${esc(g.deskripsi||"")}</p><b>${mulai(g)}</b><small>${g.tiers.length} pilihan paket</small>${t.length?`<div class="hl">${t.map(s=>`<img src="${s}" alt="Contoh logo ${esc(g.nama)}">`).join("")}</div>`:""}<span class="go">Lihat detail paket &rsaquo;</span></a>`};
const card=w=>`<div class="card" data-id="${w.id}" role="button" tabindex="0"><div class="ph"><img src="${esc(img(w.gambar_path))}" alt="${esc(w.judul)}" loading="lazy"></div><h3>${esc(w.judul)}</h3><p>${esc(catName(w))}</p></div>`;
const adv=()=>`<section class="sec alt"><div class="in adv">${[["pen","Desain Profesional","Estetis, elegan, dan penuh makna"],["clock","Proses Cepat","Tersedia pilihan Paket Kilat"],["shield","Revisi Fleksibel","Sesuai ketentuan setiap paket"],["head","Layanan Ramah","Konsultasi lewat WhatsApp"]].map(([k,t,s])=>`<div><svg viewBox="0 0 24 24">${IC[k]}</svg><b>${t}</b><small>${s}</small></div>`).join("")}</div></section>`;

function home(){
  const tiles=window.HASIL?PORT.map(i=>HASIL[i]).filter(Boolean).map((s,i)=>`<img src="${s}" alt="Contoh hasil desain logo ${i+1}">`):[];
  const port=tiles.length?tiles:D.works.slice(0,6).map(w=>`<a href="#/karya/${w.id}"><img src="${esc(img(w.gambar_path))}" alt="${esc(w.judul)}" loading="lazy"></a>`);
  app.innerHTML=`<section class="hero"><i class="mark"></i><div class="in"><p class="ey">Farroya Arabic Design</p><h1>Logo dan Kaligrafi Arab yang Berkarakter</h1><p class="lead">Desain identitas visual bernuansa Arab dan Islami untuk pesantren, brand, wedding, dan kebutuhan khusus Anda.</p><div class="row"><a class="btn pri" href="#/katalog">Lihat Katalog &rarr;</a><a class="btn wa" target="_blank" rel="noopener">Konsultasi WhatsApp</a></div></div></section>
  ${D.groups.length?`<section class="sec alt"><div class="in ed"><div><p class="ey">Paket dan harga</p><h2>Logo &amp; Kaligrafi</h2><p class="mut">Pilih paket yang sesuai dengan kebutuhan Anda. Setiap desain dibuat dengan detail, makna, dan kualitas terbaik.</p><a class="btn" href="#/paket">Lihat Semua Paket &rsaquo;</a></div><div class="gcs">${D.groups.map(gcard).join("")}</div></div></section>`:""}
  ${port.length?`<section class="silver"><div class="in"><div class="hd"><div><p class="ey">Portofolio</p><h2>Contoh Hasil Karya</h2></div><a class="lk" href="#/katalog">Lihat Katalog Lengkap &rsaquo;</a></div><div class="pg6">${port.join("")}</div></div></section>`:""}
  ${adv()}`;
  fixWa();
}

function paket(slug){
  if(!slug){app.innerHTML=`<section><h1>Paket dan harga</h1><p class="mut" style="margin:8px 0 18px">Pilih paket yang sesuai dengan kebutuhan Anda.</p>${D.groups.length?`<div class="gcs">${D.groups.map(gcard).join("")}</div>`:'<p class="mut">Daftar paket sedang disiapkan. Silakan tanyakan lewat WhatsApp.</p>'}</section>`;return}
  const g=D.groups.find(x=>x.slug===slug);
  if(!g){app.innerHTML=`<section><p class="mut">Paket tidak ditemukan.</p><a class="btn" href="#/paket">Lihat semua paket</a></section>`;return}
  app.innerHTML=`<a class="back" href="#/paket">&lsaquo; Semua paket</a><section class="panel"><h1>${esc(g.nama)}</h1><p>${esc(g.deskripsi||"")}</p><b class="from">${mulai(g)}</b></section>
  ${hl(g,9).length&&!g.tiers.some(t=>tierImgs(g,t).length)?`<section><h2>Contoh hasil</h2><div class="hlg">${hl(g,9).map(s=>`<img src="${s}" alt="Contoh logo ${esc(g.nama)}">`).join("")}</div></section>`:""}
  <section>${g.tiers.map(t=>`<article class="tier"><div class="tt"><h3>${esc(t.nama)}</h3>${t.badge?`<span class="bd${t.badge==="Kilat"?" k":""}">${esc(t.badge)}</span>`:""}</div><div class="pr${t.harga!=null?"":" t"}">${t.harga!=null?rp(t.harga):"Konfirmasi melalui WhatsApp"}</div>${t.sorotan?`<p class="hi">${esc(t.sorotan)}</p>`:""}<ul>${(t.rincian||"").split("\n").filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join("")}</ul>${tierImgs(g,t).length?`<div class="th">${tierImgs(g,t).map(s=>`<img class="zm" src="${s}" alt="Contoh hasil ${esc(g.nama)}, ${esc(t.nama)}">`).join("")}<small>Ketuk foto untuk memperbesar</small></div>`:""}<a class="btn pri wide" target="_blank" rel="noopener" href="${wa(hi+"saya tertarik dengan "+t.nama+" ("+g.nama+"). Boleh saya konsultasi?")}">${t.harga!=null?"Konsultasi paket ini":"Tanya harga lewat WhatsApp"}</a></article>`).join("")}
  ${g.katalog_query?`<a class="btn wide" href="#/katalog?${g.katalog_query}">Lihat contoh karya</a>`:""}
  <p class="note">Harga akhir, ketersediaan, dan waktu pengerjaan dikonfirmasi admin melalui WhatsApp.</p></section>`;
}

function katalog(p){
  const k=D.cats.find(c=>c.slug===p.get("k")&&!c.parent_id),s=D.cats.find(c=>c.slug===p.get("s")&&c.parent_id);
  const ws=D.works.filter(w=>(!k||w.category_id===k.id)&&(!s||w.subcategory_id===s.id)),tops=D.cats.filter(c=>!c.parent_id);
  const grp=(t,l)=>l.length?`<h2 class="gh">${esc(t)}</h2><div class="grid">${l.map(card).join("")}</div>`:"";
  const body=tops.map(c=>grp(c.nama,ws.filter(w=>w.category_id===c.id))).join("")+grp("Lainnya",ws.filter(w=>!tops.some(c=>c.id===w.category_id)));
  app.innerHTML=`<section><h1>Contoh karya</h1><p class="mut" style="margin:8px 0 14px">${k?esc(s?s.nama:k.nama)+". ":""}Ketuk gambar untuk memperbesar.</p>${k?`<a class="btn" href="#/katalog">Lihat semua karya</a>`:""}${body||'<p class="mut">Katalog sedang disiapkan. Silakan konsultasi langsung lewat WhatsApp.</p>'}</section>`;
}

function detail(id){
  const w=D.works.find(x=>x.id===id);
  if(!w){app.innerHTML=`<section><p class="mut">Karya tidak ditemukan.</p><a class="btn" href="#/katalog">Kembali ke katalog</a></section>`;return}
  const st=D.styles.filter(s=>w.work_styles.some(x=>x.style_id===s.id));
  const pk=w.work_packages.slice().sort((a,b)=>a.urutan-b.urutan);
  app.innerHTML=`<section><a class="back" href="#/katalog">&lsaquo; Kembali ke katalog</a>
  <img class="big" src="${esc(img(w.gambar_path))}" alt="${esc(w.judul)}">
  <p class="sm">${esc(catName(w))}</p><h1>${esc(w.judul)}</h1>
  ${st.length?`<div class="tags">${st.map(s=>`<span>${esc(s.nama)}</span>`).join("")}</div>`:""}
  ${w.deskripsi?`<p class="desc">${esc(w.deskripsi)}</p>`:""}
  ${pk.length?`<h2 style="margin-top:22px">Paket harga</h2>${pk.map(x=>`<div class="pkg"><b>${esc(x.nama_paket)}</b><span>${esc(x.harga_teks||"Konfirmasi melalui WhatsApp")}</span>${x.catatan?`<small>${esc(x.catatan)}</small>`:""}</div>`).join("")}`:""}
  <a class="btn pri wide" target="_blank" rel="noopener" href="${wa(hi+'saya tertarik dengan karya "'+w.judul+'" (kategori '+catName(w)+"). Boleh saya konsultasi?")}">Konsultasi lewat WhatsApp</a>
  <p class="note">Harga akhir, ketersediaan, dan waktu pengerjaan dikonfirmasi admin melalui WhatsApp.</p></section>`;
}

function tentang(){app.innerHTML=`<section><p class="ey">Tentang</p><h1>Farroya Arabic Design</h1><p class="desc">Farroya Arabic Design adalah layanan desain logo dan kaligrafi Arab. Kami membantu pesantren, lembaga, majelis, brand, hingga pasangan wedding memiliki identitas visual yang bernuansa Arab dan Islami.</p><a class="btn pri wide" href="#/paket">Lihat Paket dan Harga</a></section>${adv()}`}
function kontak(){app.innerHTML=`<section><p class="ey">Kontak</p><h1>Konsultasi Desain</h1><p class="desc">Ceritakan kebutuhan Anda lewat WhatsApp. Admin akan membantu menjelaskan paket dan detail pengerjaannya.</p><p class="sm">WhatsApp: +${esc(D.wa)}</p><a class="btn pri wide wa" target="_blank" rel="noopener">Konsultasi WhatsApp</a>${C.tiktok?`<a class="btn wide" target="_blank" rel="noopener" href="${esc(C.tiktok)}">TikTok</a>`:""}</section>`;fixWa()}

const VIP=[["Ez-Zitouna University","Tunisia"],["Al-Ahgaff University","Yaman"],["Pondok Pesantren Al-Badriyyah","Mranggen, Demak"],["Yayasan Futuhiyyah","Mranggen, Demak"],["Yayasan Pondok Pesantren Al-Haromain","Jepara"],["Pondok Pesantren Azzainiyyah","Sukabumi"],["Ma’had Baitul Arqom Al-Islami","Kabupaten Bandung"]];
const VIPT=["Diskon sebesar 20% dari harga jasa desain logo.","Berlaku untuk seluruh paket desain logo Farroya Arabic Design.","Khusus alumni dari institusi yang tercantum.","Tidak berlaku untuk harga cetak, produk fisik, maupun biaya produksi.","Pelanggan wajib menyebutkan asal institusi saat melakukan pemesanan.","Ketentuan pembayaran dan pengerjaan tetap mengikuti kebijakan Farroya."];
const VIPMSG="Assalamu’alaikum Farroya Arabic Design.\n\nSaya ingin menggunakan fasilitas Alumni Privilege diskon 20%.\n\nAsal institusi:\nNama:\nPaket desain logo yang diminati:\n\nMohon informasi lebih lanjut. Terima kasih.";
function vip(){
  document.title="FARROYA VIP – Alumni Privilege | Farroya Arabic Design";
  const cta=`<a class="btn gold" target="_blank" rel="noopener" href="${wa(VIPMSG)}">KLAIM DISKON ALUMNI</a>`;
  app.innerHTML=`<section class="vh"><i class="mark"></i><div class="in"><p class="ey gdt">Farroya VIP</p><h1>FARROYA VIP – ALUMNI PRIVILEGE</h1><div class="orn"></div><p class="d20"><span>SPECIAL</span><b>20%</b><span>DISCOUNT</span></p><p class="sub">A Special Appreciation for Our Alumni.</p><p class="lead">Sebagai bentuk apresiasi dan penghormatan Farroya Arabic Design kepada keluarga besar alumni lembaga pendidikan tertentu, kami menghadirkan penawaran khusus berupa diskon 20% untuk jasa desain logo.</p>${cta}</div></section>
  <section class="sec alt"><div class="in"><p class="ey">Institusi penerima</p><h2>Daftar Institusi Privilege</h2><div class="vg">${VIP.map(([nm,lk],i)=>`<div class="vc"><i>${String(i+1).padStart(2,"0")}</i><div><b>${esc(nm)}</b><small>${esc(lk)}</small></div></div>`).join("")}</div></div></section>
  <section class="sec"><div class="in vt"><p class="ey">Syarat dan ketentuan</p><h2>Ketentuan</h2><ul>${VIPT.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><div class="row" style="margin-top:26px">${cta}<a class="btn" href="#/paket">Lihat Paket Logo</a></div></div></section>`;
}
function fixWa(){document.querySelectorAll(".wa").forEach(a=>a.href=wa(hi+"saya ingin konsultasi desain."));const t=document.getElementById("tt");if(C.tiktok){t.href=C.tiktok;t.hidden=false}}
function route(){
  const[path,qs]=location.hash.slice(1).split("?"),p=new URLSearchParams(qs||""),m=(path||"/").split("/");
  window.scrollTo(0,0);hd.classList.remove("open");document.title="Farroya Arabic Design | Logo dan Kaligrafi Arab";app.className=m[1]?"in":"";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(m[1]||"")||(m[1]==="karya"&&a.dataset.r==="katalog")));
  const h=location.hash,go=()=>{if(m[1]==="paket")paket(m[2]);else if(m[1]==="katalog")katalog(p);else if(m[1]==="karya")detail(m[2]);else if(m[1]==="vip-alumni")vip();else if(m[1]==="tentang")tentang();else if(m[1]==="kontak")kontak();else home();fixWa()};
  if(m[1]==="katalog"||m[1]==="karya"){app.innerHTML='<p class="load">Memuat katalog...</p>';needKat().then(()=>{if(location.hash===h)go()})}else go();
}
document.getElementById("bg").onclick=()=>hd.classList.toggle("open");
const lb=h=>{const o=document.createElement("div");o.className="lb";o.innerHTML=`<div class="lbi">${h}<button class="btn lbx">Tutup</button></div>`;o.onclick=e=>{if(e.target===o||e.target.closest(".lbx"))o.remove()};document.body.appendChild(o)};
document.addEventListener("click",e=>{const z=e.target.closest("img.zm");if(z)return lb(`<img src="${z.src}" alt="${esc(z.alt)}">`);
  const c=e.target.closest(".card[data-id]");if(!c)return;const w=D.works.find(x=>x.id===c.dataset.id);if(!w)return;
  lb(`<img src="${esc(img(w.gambar_path))}" alt="${esc(w.judul)}"><h3>${esc(w.judul)}</h3><p class="sm">${esc(catName(w))}</p>${w.deskripsi?`<p class="desc">${esc(w.deskripsi)}</p>`:""}<a class="btn pri wide" target="_blank" rel="noopener" href="${wa(hi+'saya tertarik dengan karya "'+w.judul+'" (kategori '+catName(w)+"). Boleh saya konsultasi?")}">Konsultasi lewat WhatsApp</a>`)});
load().then(()=>{route();addEventListener("hashchange",route)}).catch(e=>{console.error(e);app.innerHTML=`<p class="load">Katalog belum bisa dimuat. Muat ulang halaman, atau hubungi admin jika masalah berlanjut.</p>`});
</script>
<script src="wedding.js" async onload="D&&!/katalog/.test(location.hash)&&route()"></script>
<script src="hasil.js" async onload="D&&!/katalog/.test(location.hash)&&route()"></script>
</body>
</html>
